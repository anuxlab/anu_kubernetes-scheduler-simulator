name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'   # nightly full tests (still quick with -short)
  workflow_dispatch:       # manual trigger

jobs:
  quick-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Build
        run: make

      - name: Run unit tests (short)
        run: go test -v -short -timeout 2m ./...

      - name: Run benchmarks (short)
        run: go test -bench=. -benchmem -short ./pkg/simulator/...

      - name: Upload test logs if failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: /tmp/simulator-test-*.log

  stress-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Build
        run: make

      # Now also using -short for quick, race-detected runs
      - name: Run stress tests with race detector (short)
        run: go test -v -short -race -timeout 5m ./pkg/simulator/...

      - name: Run benchmarks (short)
        run: go test -bench=. -benchmem -short ./pkg/simulator/...

      - name: Upload test logs if failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stress-test-logs
          path: /tmp/simulator-test-*.log