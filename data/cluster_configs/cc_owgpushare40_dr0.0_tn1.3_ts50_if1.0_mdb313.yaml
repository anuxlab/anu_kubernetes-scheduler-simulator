apiVersion: simon/v1alpha1
kind: Config
metadata:
  name: simon-openb-config
spec:
  appList: null
  cluster:
    customConfig: data/openb_pod_list_gpushare40
  customConfig:
    descheduleConfig:
      ratio: 0.0
    exportConfig:
      nodeSnapshotCSVFilePrefix: experiments/test_random/snapshot/ds01
      podSnapshotYamlFilePrefix: null
    newWorkloadConfig: null
    shufflePod: true
    typicalPodsConfig:
      gpuResWeight: 0
      isInvolvedCpuPods: true
      podIncreaseStep: 1
      podPopularityThreshold: 95
    workloadInflationConfig:
      ratio: 1
      seed: 233
    workloadTuningConfig:
      ratio: 1.3
      seed: 50
  newNode: example/newnode/gpushare
